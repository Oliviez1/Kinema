<!DOCTYPE html>
<html lang="fr" data-accent="ai">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#07070a">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Kinéma — Tes films et séries</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='10' fill='%233d4cff'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white'>K</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07070a;--surface:#0e0e13;--surface2:#13131a;--surface3:#1b1b24;--ink:#262631;--text:#e6e2d8;--muted:#8b8896;--hl:#ffe14d;--gold:#ffd24d;--green:#3fe0a0;--ac:#3d4cff;--rgb:61,76,255;--serif:'Dela Gothic One',system-ui,sans-serif;--nav:58px;--cw:164px;--gw:170px}
[data-accent=sakura]{--ac:#ff4f9a;--rgb:255,79,154}[data-accent=matcha]{--ac:#12a05f;--rgb:18,160,95}[data-accent=shu]{--ac:#ff4d2e;--rgb:255,77,46}[data-accent=sumire]{--ac:#8a4dff;--rgb:138,77,255}
[data-density=compact]{--cw:138px;--gw:140px}[data-density=large]{--cw:200px;--gw:206px}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{cursor:pointer;border:0;background:none;font:inherit;color:inherit}img{display:block;max-width:100%}
input,select,textarea{font:inherit;color:var(--text)}
::selection{background:var(--hl);color:#15131a}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--ink)}::-webkit-scrollbar-thumb:hover{background:var(--ac)}
#prog{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--ac);z-index:300}
.navbar{position:fixed;inset:0 0 auto 0;height:var(--nav);z-index:100;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--bg);border-bottom:3px solid var(--ink)}
.logo{font-family:var(--serif);font-size:1.15rem;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;background:var(--ac);color:#fff;border:2px solid var(--ink)}
.links{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.lk{padding:8px 13px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;border:2px solid transparent;white-space:nowrap}
.lk:hover{background:var(--surface3)}.lk.on{background:var(--hl);color:#15131a;border-color:var(--ink)}
.sbox input{width:190px;padding:9px 12px;background:var(--surface);border:2px solid var(--ink);transition:width .2s}
.sbox input:focus{outline:0;width:260px;box-shadow:3px 3px 0 var(--ac)}
.ib{width:34px;height:34px;border:2px solid var(--ink);background:var(--surface);font-weight:800;display:grid;place-items:center}.ib:hover{border-color:var(--ac)}
.sync{font-size:.95rem;width:26px;text-align:center;color:var(--green);cursor:default}.sync.wait{color:var(--gold)}.sync.err{color:#e0524f}
.main{padding-top:var(--nav);min-height:100vh}
.page{display:none}.page.on{display:block;animation:fi .2s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{max-width:1500px;margin:0 auto;padding:30px 40px}
.sec{margin-bottom:34px}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.st{font-family:var(--serif);font-size:1.25rem;background:linear-gradient(transparent 58%,var(--ac) 58%,var(--ac) 92%,transparent 92%);padding:0 8px 0 4px;white-space:nowrap}
.sh::after{content:'';flex:1;height:2px;background:var(--ink);order:1}.sh .more{order:2;font-size:.78rem;font-weight:800;text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:3px;text-underline-offset:3px;white-space:nowrap}
.row{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 16px;scrollbar-width:thin;scroll-snap-type:x proximity}
.row .card{flex:0 0 var(--cw);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--gw),1fr));gap:22px 16px}
.card{position:relative;background:var(--surface);border:2px solid var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s;overflow:hidden}
.card:hover,.card:focus-visible{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--ac)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--surface3)}
.ci{padding:9px 10px 11px;border-top:2px solid var(--ink)}
.ct{font-weight:800;font-size:.84rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.1em}
.cs{font-size:.7rem;color:var(--muted);margin-top:3px}
.sc{position:absolute;top:0;left:0;background:var(--hl);color:#15131a;font-size:.7rem;font-weight:800;padding:4px 8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.tb{position:absolute;top:8px;right:8px;background:rgba(7,7,10,.85);border:1.5px solid var(--ink);font-size:.62rem;font-weight:800;padding:2px 7px;text-transform:uppercase;letter-spacing:.05em}
.tb.movie{background:var(--gold);color:#15131a}
.qa{position:absolute;bottom:62px;right:8px;width:32px;height:32px;background:var(--ac);color:#fff;border:2px solid var(--ink);font-size:1.2rem;font-weight:700;opacity:0;transition:opacity .15s}
.card:hover .qa,.card:focus-within .qa{opacity:1}
.inl{position:absolute;top:30px;left:0;font-size:.62rem;font-weight:800;padding:2px 7px;color:#04201e;border:2px solid var(--ink);border-left:0}
.hero{position:relative;height:540px;overflow:hidden;border-bottom:3px solid var(--ink)}
.hs{position:absolute;inset:0;opacity:0;transition:opacity .7s;pointer-events:none}.hs.on{opacity:1;pointer-events:auto}
.hbg{position:absolute;right:0;top:0;width:62%;height:100%;object-fit:cover;clip-path:polygon(18% 0,100% 0,100% 100%,0 100%)}
.hbg2{position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.3) 1.2px,transparent 1.8px) 0 0/6px 6px}
.hc{position:absolute;left:56px;bottom:70px;max-width:560px;z-index:3}
.eb{display:flex;align-items:center;gap:12px;font-size:.72rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}.eb::before{content:'';width:40px;height:4px;background:var(--ac)}
.ht{font-family:var(--serif);font-size:2.9rem;line-height:1.1;margin-bottom:12px}
.hm{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:2px solid var(--ink);padding:3px 10px;font-size:.74rem;font-weight:700;background:var(--surface)}
.pill.g{background:var(--hl);color:#15131a}
.hsyn{font-size:.9rem;line-height:1.7;opacity:.8;margin-bottom:22px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--ac);color:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:800;font-size:.85rem;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.btn.s{background:var(--surface);color:var(--text)}
.dots{position:absolute;bottom:26px;left:56px;display:flex;gap:6px;z-index:4}.dot{width:22px;height:6px;background:var(--ink);cursor:pointer}.dot.on{background:var(--ac);width:46px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.pl{padding:8px 16px;border:2px solid var(--ink);background:var(--surface);font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
.pl:hover{background:var(--surface3)}.pl.on{background:var(--ac);color:#fff}
h1.pt{font-family:var(--serif);font-size:2rem;margin-bottom:18px}
.bigsearch input{width:100%;padding:14px 16px;background:var(--surface);border:2px solid var(--ink);font-size:1rem;margin-bottom:16px}
.bigsearch input:focus{outline:0;box-shadow:3px 3px 0 var(--ac)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{position:relative;overflow:hidden;text-align:left;padding:14px;min-height:104px;background:var(--surface);border:2px solid var(--ink);display:flex;flex-direction:column;justify-content:flex-end;transition:transform .12s,box-shadow .12s,background .12s}
.tile .gk{position:absolute;right:10px;top:6px;font-size:2.6rem;transition:transform .2s}
.tile b{font-size:.9rem}.tile:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--tc);background:var(--tc);color:#fff}.tile:hover .gk{transform:scale(1.15) rotate(-6deg)}
.dh{position:relative;min-height:540px;display:flex;align-items:flex-end;border-bottom:3px solid var(--ink);overflow:hidden}
.dh .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;filter:blur(8px) saturate(1.2);transform:scale(1.1)}
.dh .gr{position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.35) 1.2px,transparent 1.8px) 0 0/6px 6px,linear-gradient(to top,rgba(7,7,10,.98),rgba(7,7,10,.5))}
.dhc{position:relative;display:flex;gap:40px;align-items:flex-end;padding:120px 40px 56px;max-width:1400px;margin:0 auto;width:100%}
.dhc>img{width:230px;border:4px solid #f6f1e4;box-shadow:12px 12px 0 var(--ac);flex-shrink:0;transform:rotate(-2deg)}
.dt{font-family:var(--serif);font-size:clamp(2rem,4.5vw,3.8rem);line-height:1.05;margin-bottom:12px;text-shadow:4px 4px 0 rgba(0,0,0,.5)}
.back{position:absolute;top:calc(var(--nav) + 18px);left:40px;z-index:5;border:2px solid rgba(255,255,255,.5);padding:7px 15px;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;background:rgba(0,0,0,.4)}
.back:hover{background:var(--ac)}
.stamp{position:absolute;top:calc(var(--nav) + 20px);right:40px;z-index:5;background:var(--hl);color:#15131a;border:4px solid #15131a;box-shadow:8px 8px 0 var(--ac);padding:12px 20px 8px;transform:rotate(4deg);text-align:center;font-family:var(--serif);line-height:1}.stamp b{font-size:3rem;display:block;font-weight:400}.stamp span{font-family:Inter;font-size:.7rem;letter-spacing:.24em;font-weight:800}
.dstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:1400px;margin:-34px auto 0;padding:0 40px;position:relative;z-index:6}
.dstat{background:var(--surface);border:2px solid var(--ink);border-top:5px solid var(--ac);padding:14px 18px}.dstat b{display:block;font-family:var(--serif);font-weight:400;font-size:1.7rem;line-height:1.05;margin-bottom:5px}.dstat span{font-size:.66rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:800}
.dnav{position:sticky;top:var(--nav);z-index:30;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--bg);border-bottom:2px solid var(--ink);margin-top:26px;padding:0 max(40px,calc((100% - 1400px)/2 + 40px))}
.dnav button{padding:15px 20px 13px;font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}.dnav button:hover{color:var(--text)}
.db{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:36px;max-width:1400px;margin:0 auto;padding:30px 40px 70px}
.dsec{scroll-margin-top:130px;margin-bottom:32px}
.syn{font-size:1.02rem;line-height:1.9;border-left:5px solid var(--ac);padding-left:20px;margin-bottom:12px;max-width:800px;opacity:.92}
.synh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.synh .pt2{margin:0}
.panel{background:var(--surface);border:2px solid var(--ink);padding:18px;margin-bottom:14px}
.panel.t{border-top:5px solid var(--ac);box-shadow:5px 5px 0 var(--ac)}
.pt2{font-family:var(--serif);font-size:.95rem;margin-bottom:12px}
.ir{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--ink);font-size:.81rem}.ir:last-child{border:0}.ir span:first-child{color:var(--muted)}.ir b{text-align:right}
select.f,input.f,textarea.f{width:100%;padding:10px 12px;background:var(--surface2);border:2px solid var(--ink);margin-bottom:10px}
textarea.f{resize:vertical;min-height:70px}
.stars{display:flex;gap:2px;margin:6px 0 12px}.star{font-size:1.4rem;color:var(--gold);opacity:.25;cursor:pointer}.star.on{opacity:1}.star:hover{opacity:1;transform:scale(1.2)}
.bar{height:10px;border:2px solid var(--ink);background:var(--surface);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.season{margin-bottom:22px}
.sth{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800}
.ep{display:flex;gap:12px;align-items:center;padding:9px 12px;border:2px solid var(--ink);background:var(--surface2);margin-bottom:6px;cursor:pointer}
.ep:hover{border-color:var(--ac)}.ep.w{border-color:rgba(63,224,160,.5);background:rgba(63,224,160,.07)}
.en{width:36px;height:36px;display:grid;place-items:center;background:var(--surface3);font-family:var(--serif);font-size:.82rem;flex-shrink:0}.ep.w .en{background:rgba(63,224,160,.2);color:var(--green)}
.ek{margin-left:auto;width:22px;height:22px;border:2px solid var(--ink);display:grid;place-items:center;font-size:.7rem;color:transparent}.ep.w .ek{background:var(--green);border-color:var(--green);color:#04201e}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px}.cast img{width:100%;aspect-ratio:3/4;object-fit:cover;border:2px solid var(--ink);background:var(--surface3)}.cast b{display:block;font-size:.76rem;margin-top:5px}.cast small{font-size:.68rem;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px}
.day{flex:1;min-width:66px;padding:10px 6px;border:2px solid var(--ink);background:var(--surface);text-align:center}.day span{display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--muted)}.day b{font-family:var(--serif);font-size:1.4rem}.day.on{background:var(--ac);color:#fff}.day.on span{color:#fff}
.sr{display:flex;align-items:center;gap:16px;padding:10px 14px;background:var(--surface);border:2px solid var(--ink);border-left:6px solid var(--ink);margin-bottom:8px;cursor:pointer}.sr:hover,.sr.m{border-left-color:var(--ac)}
.sr .tm{font-family:var(--serif);font-size:1.2rem;width:62px;flex-shrink:0}.sr img{width:42px;height:60px;object-fit:cover}
.toasts{position:fixed;bottom:22px;right:22px;z-index:99999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:2px solid var(--ink);padding:11px 15px;font-size:.84rem;box-shadow:4px 4px 0 var(--ac);animation:fi .2s;max-width:330px}
.spin{width:24px;height:24px;border:3px solid var(--ink);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--muted);border:2px dashed var(--ink)}
.foot{text-align:center;padding:30px;font-size:.75rem;color:var(--muted);border-top:3px solid var(--ink);line-height:1.7}
.note{font-size:.76rem;color:var(--muted);line-height:1.6;margin-top:8px}
.keybox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 18px;margin-bottom:28px;background:var(--surface);border:2px solid var(--hl);box-shadow:5px 5px 0 var(--hl)}
.keybox p{flex:1;min-width:240px;font-size:.84rem;line-height:1.55}.keybox input{padding:10px 12px;background:var(--surface2);border:2px solid var(--ink);width:280px;max-width:100%}
.nextep{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--green);margin:8px 0 12px;font-size:.8rem}
.cc{flex:0 0 310px;display:flex;gap:12px;align-items:center;padding:11px;background:var(--surface);border:2px solid var(--ink);border-left:6px solid var(--ac);cursor:pointer;scroll-snap-align:start}.cc:hover{border-color:var(--ac)}
.cc img{width:54px;height:78px;object-fit:cover;border:2px solid var(--ink);flex-shrink:0}.cc .b{flex:1;min-width:0}
/* ===== MA LISTE ===== */
.ml-hero{position:relative;overflow:hidden;border-bottom:3px solid var(--ink);background:var(--surface);padding:46px 40px 36px}
.ml-hero::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,transparent 0 22px,rgba(var(--rgb),.1) 22px 24px);pointer-events:none}
.ml-in{position:relative;z-index:2;max-width:1400px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:30px;flex-wrap:wrap}
.ml-k{font-size:.72rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--ac);margin-bottom:8px}
.ml-t{font-family:var(--serif);font-size:clamp(2.6rem,6vw,4.6rem);line-height:.95;text-transform:uppercase}
.ml-sub{color:var(--muted);font-size:.92rem;margin-top:12px}
.ml-stats{display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:12px}
.ml-stat{background:var(--bg);border:2px solid var(--ink);border-top:5px solid var(--ac);padding:12px 16px;min-width:110px}.ml-stat b{display:block;font-family:var(--serif);font-weight:400;font-size:1.8rem;line-height:1.05;margin-bottom:5px}.ml-stat span{font-size:.64rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:800}
.ml-big{position:absolute;right:3%;bottom:-60px;font-family:var(--serif);font-size:15rem;line-height:1;color:var(--ac);opacity:.08;pointer-events:none}
.ml-wrap{max-width:1400px;margin:0 auto;padding:30px 40px 70px}
.ml-sech{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:1.5rem;text-transform:uppercase;margin-bottom:16px}.ml-sech::before{content:'';width:12px;height:12px;background:var(--ac)}.ml-sech em{font-style:normal;font-family:Inter;font-size:.72rem;font-weight:800;background:var(--hl);color:#15131a;border:2px solid var(--ink);padding:1px 9px}
.ml-res-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-bottom:34px}
.ml-res{display:flex;gap:14px;padding:12px;background:var(--surface);border:2px solid var(--ink);border-left:6px solid var(--ac);cursor:pointer;transition:transform .12s,box-shadow .12s}.ml-res:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--ac)}
.ml-res img{width:70px;height:100px;object-fit:cover;border:2px solid var(--ink);flex-shrink:0}.ml-res .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ml-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.ml-tabs{display:flex;gap:8px;flex-wrap:wrap}
.ml-tab{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:2px solid var(--ink);background:var(--surface);font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.07em}.ml-tab:hover{background:var(--surface3)}.ml-tab.on{background:var(--hl);color:#15131a}
.ml-tab em{font-style:normal;background:var(--bg);color:var(--text);border:1.5px solid var(--ink);padding:0 7px;font-size:.7rem}.ml-tab.on em{background:#15131a;color:#fff}
.ml-dot{width:10px;height:10px;background:var(--c);display:inline-block}
.ml-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ml-search{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--surface);padding:0 12px;min-width:200px}.ml-search input{border:0;outline:0;background:transparent;padding:10px 0;width:100%;font-size:.86rem}.ml-search:focus-within{box-shadow:3px 3px 0 var(--ac)}
.ml-sel{border:2px solid var(--ink);background:var(--surface);padding:10px 12px;font-weight:600;font-size:.84rem}
.ml-view{display:flex;border:2px solid var(--ink)}.ml-view button{padding:10px 16px;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.ml-view button.on{background:var(--ac);color:#fff}
.ml-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--gw) + 20px),1fr));gap:26px 18px}

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const ownerRef = doc(db, 'meta', 'owner');
let started = false;

async function ownerExists() { try { return (await getDoc(ownerRef)).exists(); } catch (e) { return null; } }
function showForms(ownerTaken) {
  $a('asub').textContent = ownerTaken ? 'Accès privé · connecte-toi' : 'Premier lancement · crée ton compte propriétaire';
  $a('atabs').style.display = ownerTaken ? 'none' : 'flex';
  $a('f-login').style.display = ownerTaken ? '' : 'none';
  $a('f-reg').style.display = ownerTaken ? 'none' : '';
  if (!ownerTaken) window.authTab('reg');
}
window.authTab = t => {
  $a('f-login').style.display = t === 'login' ? '' : 'none';
  $a('f-reg').style.display = t === 'reg' ? '' : 'none';
  $a('t-login').classList.toggle('on', t === 'login');
  $a('t-reg').classList.toggle('on', t === 'reg');
  err('');
};
window.doLogin = async () => {
  const p = clean($a('lp').value), w = $a('lw').value;
  if (!p || !w) return err('Entre ton pseudo et ton mot de passe');
  err('⏳ Connexion…');
  try { await signInWithEmailAndPassword(auth, p + DOMAIN, w); err(''); }
  catch (e) {
    const bad = ['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-email'];
    err(bad.includes(e.code) ? 'Pseudo ou mot de passe incorrect' : e.code === 'auth/too-many-requests' ? 'Trop d\'essais : réessaie dans quelques minutes' : e.message);
  }
};
window.doRegister = async () => {
  const p = clean($a('rp').value), w = $a('rw').value;
  if (p.length < 3) return err('Pseudo trop court (3 caractères minimum)');
  if (w.length < 6) return err('Mot de passe trop court (6 minimum)');
  if (w !== $a('rw2').value) return err('Les mots de passe ne correspondent pas');
  err('⏳ Création…');
  if (await ownerExists()) { showForms(true); return err('Les inscriptions sont fermées : ce site a déjà un propriétaire.'); }
  let cred;
  try { cred = await createUserWithEmailAndPassword(auth, p + DOMAIN, w); }
  catch (e) { return err(e.code === 'auth/email-already-in-use' ? 'Ce pseudo existe déjà' : e.message); }
  try {
    await setDoc(ownerRef, { uid: cred.user.uid, pseudo: p, createdAt: Date.now() });
    await setDoc(doc(db, 'users', cred.user.uid), { pseudo: p, list: [], updatedAt: Date.now() });
  } catch (e) {
    try { await cred.user.delete(); } catch (x) {}
    showForms(true); err('Inscriptions fermées : le propriétaire existe déjà.');
  }
};
window.doLogout = async () => {
  if (!(await window.kkConfirm('Se déconnecter ?', 'Tu devras te reconnecter avec ton pseudo et ton mot de passe.', 'Se déconnecter'))) return;
  try { if (window.flushSave) await window.flushSave(); } catch (e) {}
  await signOut(auth);
  ['kinema_tmdb', 'kinema_acc'].forEach(k => localStorage.removeItem(k));
  try { sessionStorage.clear(); } catch (e) {}
  location.reload();
};
window.cloudSave = async payload => {
  const u = auth.currentUser; if (!u) throw new Error('Non connecté');
  await setDoc(doc(db, 'users', u.uid), { ...payload, updatedAt: Date.now() }, { merge: true });
};
window.cloudLoad = async () => {
  const u = auth.currentUser; if (!u) throw new Error('Non connecté');
  const s = await getDoc(doc(db, 'users', u.uid)); return s.exists() ? s.data() : { list: [] };
};
window.changePassword = async (oldPw, newPw) => {
  const u = auth.currentUser; if (!u) throw new Error('Non connecté');
  if (!newPw || newPw.length < 6) throw new Error('6 caractères minimum');
  await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, oldPw));
  await updatePassword(u, newPw);
};

onAuthStateChanged(auth, async user => {
  if (!user) {
    $a('auth').style.display = 'flex';
    const taken = await ownerExists();
    if (taken === null) { $a('asub').textContent = ''; err('Impossible de joindre Firebase (réseau ou règles Firestore).'); return; }
    showForms(taken);
    return;
  }
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    const data = snap.exists() ? snap.data() : { list: [] };
    $a('auth').style.display = 'none';
    window.USER_PSEUDO = data.pseudo || (user.email || '').replace(DOMAIN, '');
    if (!started) { started = true; window.startApp(data); }
  } catch (e) {
    await signOut(auth);
    $a('auth').style.display = 'flex';
    err('Accès refusé : ce compte n\'est pas le propriétaire du site.');
  }
});
</script>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=h=>(h||'').replace(/<[^>]+>/g,'').trim();
const FALLBACK="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='300' height='450'><rect width='300' height='450' fill='#1b1b24'/><text x='150' y='230' fill='#8b8896' font-size='20' text-anchor='middle' font-family='sans-serif'>Pas d'affiche</text></svg>");
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200)}
const ST={planned:['À voir','#7aa2ff'],watching:['En cours','#b79bff'],completed:['Terminé','#3fe0a0'],dropped:['Abandonné','#e0524f']};
const GFR={Drama:'Drame',Comedy:'Comédie',Crime:'Policier','Science-Fiction':'Science-fiction',Fantasy:'Fantastique',Horror:'Horreur',Mystery:'Mystère',Adventure:'Aventure',Family:'Famille',Anime:'Animation',War:'Guerre',History:'Histoire',Medical:'Médical',Legal:'Judiciaire',Music:'Musique',Sports:'Sport',Supernatural:'Surnaturel',Espionage:'Espionnage',Food:'Cuisine',Travel:'Voyage'};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ===== MODALES / CONFIRM ===== */
function kkConfirm(title,text,yes='Confirmer'){return new Promise(res=>{
  const bg=document.createElement('div');bg.className='cfm-bg';
  bg.innerHTML=`<div class="cfm" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row2"><button class="no">Annuler</button><button class="yes">${esc(yes)}</button></div></div>`;
  const done=v=>{bg.remove();document.removeEventListener('keydown',onk);res(v)};const onk=e=>{if(e.key==='Escape')done(false)};
  bg.addEventListener('click',e=>{if(e.target===bg)done(false)});bg.querySelector('.no').onclick=()=>done(false);bg.querySelector('.yes').onclick=()=>done(true);
  document.addEventListener('keydown',onk);document.body.appendChild(bg);bg.querySelector('.no').focus()})}
window.kkConfirm=kkConfirm;
function openModal(title,html,cls=''){closeModal();const o=document.createElement('div');o.className='mov';o.id='mov';
  o.innerHTML=`<div class="mbx ${cls}" role="dialog" aria-modal="true"><header><span>${title}</span><button class="ib" aria-label="Fermer" onclick="closeModal()">✕</button></header><div class="bd2">${html}</div></div>`;
  o.addEventListener('mousedown',e=>{if(e.target===o)closeModal()});$('#modals').appendChild(o);return o}
function closeModal(){$('#modals').innerHTML=''}

/* ===== ÉTAT + SAUVEGARDE CLOUD ===== */
const DEF_PROFILE={bio:'',mood:'',top3:[],emoji:'🎬',density:'normal',pattern:'lines',accent:'ai',autoTr:false};
let LIST=[],PROFILE={...DEF_PROFILE},ver=0,savedVer=0,_st=null,lastSync=null;
const payload=()=>({list:LIST,tmdb:localStorage.getItem('kinema_tmdb')||'',accent:PROFILE.accent,profile:PROFILE});
function setSync(s){const e=$('#sync');if(!e)return;e.className='sync '+(s==='ok'?'':s);e.textContent=s==='ok'?'☁':s==='wait'?'⏳':'⚠';e.title=s==='ok'?'Tout est enregistré':s==='wait'?'Enregistrement…':'Échec de la sauvegarde (vérifie ta connexion)'}
async function flushSave(){
  clearTimeout(_st);
  if(ver===savedVer||!window.cloudSave)return;
  const v=ver;
  try{await window.cloudSave(payload());savedVer=v;lastSync=new Date();setSync(ver===savedVer?'ok':'wait');if(ver!==savedVer)return flushSave()}
  catch(e){setSync('err');toast('Sauvegarde impossible : '+e.message)}
}
window.flushSave=flushSave;
const save=()=>{ver++;setSync('wait');clearTimeout(_st);_st=setTimeout(flushSave,600)};
addEventListener('beforeunload',e=>{if(ver!==savedVer){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='hidden'){flushSave();return}
  if(window.APP_ON&&ver===savedVer&&window.cloudLoad){
    try{const d=await window.cloudLoad();
      if(ver===savedVer&&JSON.stringify(d.list||[])!==JSON.stringify(LIST)){LIST=d.list||[];toast('Liste synchronisée');route2()}
      lastSync=new Date()}catch(e){}
  }
});
addEventListener('online',()=>{if(ver!==savedVer)flushSave()});
function applyLook(){const r=document.documentElement;r.dataset.accent=PROFILE.accent||'ai';r.dataset.density=['compact','large'].includes(PROFILE.density)?PROFILE.density:'normal'}

const inList=k=>LIST.find(x=>x.key===k);
const TMDB=()=>localStorage.getItem('kinema_tmdb')||'';
const CACHE={};
async function getJSON(url){
  if(CACHE[url])return CACHE[url];
  try{const s=sessionStorage.getItem('c:'+url);if(s){const o=JSON.parse(s);if(Date.now()-o.t<600000){CACHE[url]=o.v;return o.v}}}catch(e){}
  let r=await fetch(url);
  if(r.status===429){await sleep(1300);r=await fetch(url)}
  if(!r.ok)throw new Error('HTTP '+r.status);
  const v=await r.json();CACHE[url]=v;
  try{const j=JSON.stringify({t:Date.now(),v});if(j.length<300000)sessionStorage.setItem('c:'+url,j)}catch(e){}
  return v;
}
const isoDay=(off=0)=>{const d=new Date();d.setDate(d.getDate()+off);return d.toLocaleDateString('sv-SE')};
async function cached(name,fn,days=3){
  try{const o=JSON.parse(localStorage.getItem('kc_'+name)||'null');if(o&&Date.now()-o.t<days*864e5&&o.v.length)return o.v}catch(e){}
  const v=await fn();if(v.length)try{localStorage.setItem('kc_'+name,JSON.stringify({t:Date.now(),v}))}catch(e){}
  return v;
}

/* ===== SÉRIES : TVmaze (sans clé) ===== */
const TVM='https://api.tvmaze.com';
function normTV(s){return{key:'tv:'+s.id,type:'tv',id:s.id,lang:'en',title:s.name,cover:s.image?.original||s.image?.medium||'',score:s.rating?.average||null,
  year:(s.premiered||'').slice(0,4),genres:(s.genres||[]).map(g=>GFR[g]||g),synopsis:strip(s.summary),status:s.status,network:s.network?.name||s.webChannel?.name||'',
  runtime:s.averageRuntime||s.runtime||45,url:s.officialSite||s.url}}
async function tvAiring(off=0){
  const d=isoDay(off);
  const rs=await Promise.allSettled([getJSON(`${TVM}/schedule/web?date=${d}`),getJSON(`${TVM}/schedule?country=US&date=${d}`),getJSON(`${TVM}/schedule?country=FR&date=${d}`)]);
  const out=[];rs.forEach(r=>{if(r.status==='fulfilled')r.value.forEach(e=>{const s=e.show||e._embedded?.show;if(s)out.push({ep:e,show:s})})});
  return out;
}
async function tvOnAir(){
  const items=await tvAiring(0),seen=new Set(),res=[];
  items.forEach(({show})=>{if(!seen.has(show.id)&&show.image&&(show.rating?.average||0)>=7&&!['Talk Show','News','Sports','Variety','Reality'].includes(show.type)){seen.add(show.id);res.push(normTV(show))}});
  return res.sort((a,b)=>(b.score||0)-(a.score||0));
}
const FAM_TV=['Breaking Bad','Game of Thrones','Stranger Things','The Boys','Better Call Saul','Peaky Blinders','The Last of Us','Dark','Money Heist','Squid Game','The Witcher','Wednesday','House of the Dragon','The Mandalorian','Sherlock','Friends','The Office','Narcos','Black Mirror','Vikings','Chernobyl','True Detective','Succession','The Walking Dead','Dexter','Lucifer','Arcane','Fallout','Severance','The Bear','Ozark','Mindhunter','Prison Break','The Big Bang Theory','How I Met Your Mother','Lupin','Peacemaker','Loki','The Crown','Narcos: Mexico','Mr. Robot','Westworld','Hannibal','Fargo','Gotham','Daredevil','Invincible','Rick and Morty','Attack on Titan','Death Note'];
async function tvPopularNow(){
  return cached('famtv2',async()=>{
    const out=[];
    for(let i=0;i<FAM_TV.length;i+=8){
      const rs=await Promise.allSettled(FAM_TV.slice(i,i+8).map(n=>getJSON(`${TVM}/singlesearch/shows?q=${encodeURIComponent(n)}`)));
      rs.forEach(r=>{if(r.status==='fulfilled'&&r.value&&r.value.image)out.push(normTV(r.value))});
      await sleep(700);
    }
    return out;
  },7);
}
const tvSearch=async q=>(await getJSON(`${TVM}/search/shows?q=${encodeURIComponent(q)}`)).map(x=>normTV(x.show)).sort((a,b)=>(b.score||0)-(a.score||0));
async function tvDetail(id){const s=await getJSON(`${TVM}/shows/${id}?embed[]=episodes&embed[]=cast&embed[]=nextepisode`);const n=normTV(s);
  n.episodes=(s._embedded?.episodes||[]).map(e=>({id:e.id,season:e.season,number:e.number,name:e.name,airdate:e.airdate}));
  n.cast=(s._embedded?.cast||[]).slice(0,12).map(c=>({name:c.person.name,role:c.character.name,img:c.person.image?.medium||''}));
  const ne=s._embedded?.nextepisode;n.next=ne&&ne.airstamp?{t:new Date(ne.airstamp).getTime(),s:ne.season,n:ne.number}:null;
  n.totalEps=n.episodes.length;return n}

/* ===== FILMS : TMDB (clé gratuite) ou iTunes (sans clé) ===== */
const ITU='https://itunes.apple.com';
const big=u=>(u||'').replace(/\d+x\d+(bb)?\./,'600x900bb.');
function normIT(m){return{key:'it:'+m.trackId,type:'movie',id:m.trackId,lang:'fr',title:m.trackName,cover:big(m.artworkUrl100),score:null,year:(m.releaseDate||'').slice(0,4),
  genres:m.primaryGenreName?[m.primaryGenreName]:[],synopsis:m.longDescription||m.shortDescription||'',director:m.artistName,runtime:m.trackTimeMillis?Math.round(m.trackTimeMillis/60000):null,
  preview:m.previewUrl,url:m.trackViewUrl,rating:m.contentAdvisoryRating}}
const TMI='https://image.tmdb.org/t/p/';
const GENRE_TM={28:'Action',12:'Aventure',16:'Animation',35:'Comédie',80:'Policier',99:'Documentaire',18:'Drame',10751:'Famille',14:'Fantastique',36:'Histoire',27:'Horreur',10402:'Musique',9648:'Mystère',10749:'Romance',878:'Science-fiction',53:'Thriller',10752:'Guerre',37:'Western'};
const GID=Object.fromEntries(Object.entries(GENRE_TM).map(([k,v])=>[v,k]));
function normTM(m){return{key:'tm:'+m.id,type:'movie',id:m.id,lang:'fr',title:m.title,cover:m.poster_path?TMI+'w500'+m.poster_path:'',banner:m.backdrop_path?TMI+'w1280'+m.backdrop_path:'',
  score:m.vote_average?Math.round(m.vote_average*10)/10:null,year:(m.release_date||'').slice(0,4),
  genres:(m.genres||(m.genre_ids||[]).map(i=>({name:GENRE_TM[i]})).filter(g=>g.name)).map(g=>g.name),synopsis:m.overview||'',runtime:m.runtime||null,url:'https://www.themoviedb.org/movie/'+m.id}}
const tm=(path,p='')=>getJSON(`https://api.themoviedb.org/3${path}?api_key=${TMDB()}&language=fr-FR${p}`);
const tmList=async(path,p='')=>(await tm(path,p)).results.filter(m=>m.poster_path).map(normTM);
async function movFamous(name,terms,per){
  return cached('fm_'+name,async()=>{
    const seen=new Set(),out=[];
    for(const t of terms){
      try{(await getJSON(`${ITU}/search?term=${encodeURIComponent(t)}&media=movie&entity=movie&country=fr&limit=${per}`)).results.forEach(m=>{const a=normIT(m);if(!seen.has(a.key)&&m.artworkUrl100){seen.add(a.key);out.push(a)}})}catch(e){}
      await sleep(400);
    }
    return out;
  },7);
}
const DISC='&sort_by=popularity.desc&vote_count.gte=500';
const FILM_ROWS=[
 ['Tendances de la semaine',()=>tmList('/trending/movie/week'),['Marvel Avengers','Star Wars','Harry Potter','Batman','James Bond','Jurassic Park'],5],
 ['Au cinéma',()=>tmList('/movie/now_playing','&region=FR'),['Mission Impossible','Fast and Furious','Pixar','Disney'],5],
 ['Les mieux notés',()=>tmList('/movie/top_rated'),['Le Parrain','Pulp Fiction','Inception','Interstellar','Gladiator','Titanic'],2],
 ['Action',()=>tmList('/discover/movie','&with_genres=28'+DISC),['John Wick','Die Hard','Mad Max','Taken'],4],
 ['Science-fiction',()=>tmList('/discover/movie','&with_genres=878'+DISC),['Matrix','Alien','Blade Runner','Avatar'],4],
 ['Horreur',()=>tmList('/discover/movie','&with_genres=27'+DISC),['Conjuring','Scream','Halloween','Ça'],4],
 ['Animation',()=>tmList('/discover/movie','&with_genres=16'+DISC),['Toy Story','Le Roi Lion','Shrek','Les Indestructibles'],4],
 ['Comédie',()=>tmList('/discover/movie','&with_genres=35'+DISC),['Very Bad Trip','Intouchables','Les Bronzés','Astérix'],4],
 ['Thriller',()=>tmList('/discover/movie','&with_genres=53'+DISC),['Seven','Shutter Island','Le Silence des agneaux','Joker'],3],
 ['Drame',()=>tmList('/discover/movie','&with_genres=18'+DISC),['Forrest Gump','Les Évadés','Fight Club'],3],
 ['Aventure',()=>tmList('/discover/movie','&with_genres=12'+DISC),['Indiana Jones','Pirates des Caraïbes','Le Seigneur des anneaux'],3]
];
async function movRow(i){const [,tmf,terms,per]=FILM_ROWS[i];return TMDB()?tmf():movFamous('row'+i,terms,per)}
async function movSearch(q){
  if(TMDB())return tmList('/search/movie','&query='+encodeURIComponent(q));
  return (await getJSON(`${ITU}/search?term=${encodeURIComponent(q)}&media=movie&entity=movie&country=fr&limit=40`)).results.map(normIT);
}
async function movByGenre(g){
  if(TMDB()&&GID[g])return tmList('/discover/movie','&with_genres='+GID[g]+DISC);
  return movSearch(g);
}
async function movDetail(key){
  const [p,id]=key.split(':');
  if(p==='tm'){const m=await tm('/movie/'+id,'&append_to_response=credits,videos');const n=normTM(m);
    n.cast=(m.credits?.cast||[]).slice(0,12).map(c=>({name:c.name,role:c.character,img:c.profile_path?TMI+'w185'+c.profile_path:''}));
    const vs=m.videos?.results||[];
    const v=vs.find(v=>v.site==='YouTube'&&v.type==='Trailer'&&v.iso_639_1==='fr')||vs.find(v=>v.site==='YouTube'&&v.type==='Trailer');
    n.trailer=v?'https://www.youtube-nocookie.com/embed/'+v.key:null;
    n.collection=m.belongs_to_collection?.id||null;n.collName=m.belongs_to_collection?.name||'';
    n.director=(m.credits?.crew||[]).find(c=>c.job==='Director')?.name;return n}
  const r=await getJSON(`${ITU}/lookup?id=${id}&country=fr`);return normIT(r.results[0]);
}
async function getItem(key){return key.startsWith('tv:')?tvDetail(key.slice(3)):movDetail(key)}

/* ===== CARTES ===== */
const CC={};
function card(a,qa=true){CC[a.key]=a;const l=inList(a.key);
  return`<div class="card" data-k="${esc(a.key)}" role="link" tabindex="0" onkeydown="if(event.key==='Enter')this.click()" onclick="location.hash='#item/${esc(a.key)}'"><img src="${esc(a.cover||FALLBACK)}" alt="Affiche : ${esc(a.title)}" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK}'">
  ${a.score?`<div class="sc">★ ${a.score}</div>`:''}<div class="tb ${a.type}">${a.type==='tv'?'Série':'Film'}</div>
  ${l?`<div class="inl" style="background:${ST[l.status][1]}">${ST[l.status][0]}</div>`:''}
  ${qa&&!l?`<button class="qa" aria-label="Ajouter à ma liste" onclick="event.stopPropagation();quickAdd('${esc(a.key)}')">+</button>`:''}
  <div class="ci"><div class="ct">${esc(a.title)}</div><div class="cs">${esc(a.year||'')}${a.genres[0]?' · '+esc(a.genres[0]):''}</div></div></div>`}
const grid=l=>l.length?`<div class="grid">${l.map(a=>card(a)).join('')}</div>`:'<div class="empty">Aucun résultat.</div>';
const spin='<div class="spin" role="status" aria-label="Chargement"></div>';
function quickAdd(key){
  const a=CC[key];if(!a||inList(key))return;add(a);toast(a.title+' ajouté ✓');
  document.querySelectorAll('.card[data-k]').forEach(c=>{if(c.dataset.k!==key)return;c.querySelector('.qa')?.remove();
    if(!c.querySelector('.inl'))c.insertAdjacentHTML('afterbegin',`<div class="inl" style="background:${ST.planned[1]}">À voir</div>`)});
}
function add(a,status='planned'){if(inList(a.key))return;LIST.push({key:a.key,type:a.type,id:a.id,title:a.title,cover:a.cover,genres:a.genres||[],year:a.year,status,rating:0,watched:[],totalEps:a.totalEps||0,runtime:a.runtime||(a.type==='tv'?45:110),addedAt:Date.now()});save()}
function keyBox(){return TMDB()?'':`<div class="keybox"><p><b>Pour avoir les vrais films populaires</b> (tendances, notes, genres, bandes-annonces), colle ta clé TMDB gratuite : <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener noreferrer" style="text-decoration:underline">themoviedb.org/settings/api</a> (« API Key », pas le « Read Access Token »). Elle sera enregistrée dans ton compte.</p>
  <input id="kk" aria-label="Clé API TMDB" placeholder="Clé API TMDB (32 caractères)"><button class="btn" onclick="setKey($('#kk').value)">Activer</button></div>`}
async function setKey(v){v=(v||'').trim();if(v&&!/^[a-f0-9]{32}$/i.test(v)){toast('Clé invalide : 32 caractères (API Key v3)');return}
  v?localStorage.setItem('kinema_tmdb',v):localStorage.removeItem('kinema_tmdb');
  ver++;try{await flushSave();toast('Clé enregistrée ✓')}catch(e){toast('Erreur : '+e.message)}
  setTimeout(()=>location.reload(),500)}

/* ===== EFFETS ===== */
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=$('#confetti'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#3d4cff','#ffe14d','#e6e2d8','#3fe0a0','#ff4f9a','#ff4d2e'];

/* ===== TRADUCTEUR (MyMemory, gratuit, sans clé) ===== */
const TR_API='https://api.mymemory.translated.net/get';
const _enc=new TextEncoder(),trBytes=s=>_enc.encode(s).length,MAXB=420;
const decHtml=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
const SVGF=b=>`<svg viewBox="0 0 60 40" width="46" height="31" aria-hidden="true" style="display:block;border:1px solid rgba(128,128,128,.55)">${b}</svg>`;
const TRL=[
 {c:'fr',n:'Français',f:SVGF('<rect width="20" height="40" fill="#0055A4"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#EF4135"/>')},
 {c:'en',n:'English',f:SVGF('<rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" stroke="#C8102E" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="13"/><path d="M30 0V40M0 20H60" stroke="#C8102E" stroke-width="7"/>')},
 {c:'es',n:'Español',f:SVGF('<rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/>')},
 {c:'pt',n:'Português',f:SVGF('<rect width="60" height="40" fill="#FF0000"/><rect width="24" height="40" fill="#006600"/><circle cx="24" cy="20" r="7" fill="#FFCC00"/><circle cx="24" cy="20" r="4" fill="#FF0000"/>')},
 {c:'de',n:'Deutsch',f:SVGF('<rect width="60" height="14" fill="#000"/><rect y="14" width="60" height="13" fill="#DD0000"/><rect y="27" width="60" height="13" fill="#FFCE00"/>')},
 {c:'it',n:'Italiano',f:SVGF('<rect width="20" height="40" fill="#009246"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#CE2B37"/>')}
];
function trChunk(par){
  const sents=par.split(/(?<=[.!?…])\s+/),out=[];let cur='';
  const push=()=>{if(cur.trim())out.push(cur.trim());cur=''};
  for(let s of sents){
    while(trBytes(s)>MAXB){let cut=s.lastIndexOf(' ',Math.floor(MAXB/1.2));if(cut<20)cut=Math.floor(MAXB/1.2);if(cur)push();out.push(s.slice(0,cut).trim());s=s.slice(cut).trim()}
    if(trBytes(cur+' '+s)>MAXB)push();
    cur=cur?cur+' '+s:s;
  }
  push();return out;
}
async function trOne(q,src,lang){
  const r=await fetch(TR_API+'?langpair='+encodeURIComponent(src+'|'+lang)+'&q='+encodeURIComponent(q));
  if(r.status===429)throw new Error('quota');
  const j=await r.json(),t=j&&j.responseData&&j.responseData.translatedText;
  if(String(j&&j.responseStatus)==='429'||/MYMEMORY WARNING/i.test(t||''))throw new Error('quota');
  if(!t||String(j.responseStatus)!=='200')throw new Error('fail');
  return decHtml(t);
}
async function translateText(text,src,lang){
  const res=[];
  for(const p of text.split(/\n+/).map(s=>s.trim()).filter(Boolean)){const parts=[];for(const c of trChunk(p))parts.push(await trOne(c,src,lang));res.push(parts.join(' '))}
  return res.join('\n');
}
function setupTr(a){
  const p=$('#synP'),btn=$('#trBtn'),note=$('#trNote');if(!p||!btn||!note)return;
  const src=a.lang||'en',text=a.synopsis||'';
  if(!text){btn.style.display='none';return}
  let cur=src,busy=false;const mem={};
  const ck=l=>'kinema_tr_'+a.key+'_'+l;
  const getC=l=>{try{return localStorage.getItem(ck(l))}catch(e){return null}};
  const setC=(l,v)=>{try{localStorage.setItem(ck(l),v)}catch(e){}};
  const html=t=>esc(t).replace(/\n/g,'<br>');
  const L=c=>TRL.find(x=>x.c===c)||TRL[0];
  function paint(){
    const l=L(cur);p.innerHTML=cur===src?html(text):html(mem[cur]||text);
    note.style.display=cur===src?'none':'block';note.textContent='Traduction automatique en '+l.n+' : elle peut contenir des erreurs.';
    btn.textContent=(busy?'Traduction…':(cur===src?'🌐 Traduire':'🌐 '+l.n))+' ▾';btn.disabled=busy;
  }
  async function choose(code){
    closeModal();if(code===cur||busy)return;
    if(code===src){cur=src;paint();return}
    if(!mem[code]){
      const c=getC(code);
      if(c)mem[code]=c;
      else{
        busy=true;const prev=cur;cur=code;paint();
        try{const out=await translateText(text,src,code);setC(code,out);mem[code]=out}
        catch(e){busy=false;cur=prev;toast(e.message==='quota'?'Limite de traduction gratuite atteinte pour aujourd\u2019hui, réessaie demain.':'Traduction impossible pour le moment.');paint();return}
        busy=false;
      }
    }
    cur=code;paint();
  }
  window._trChoose=choose;
  btn.onclick=()=>{
    openModal('Langue du synopsis',`<div class="lg">${TRL.map(l=>{const on=l.c===cur,ready=l.c===src||mem[l.c]||getC(l.c);
      return`<button class="${on?'on':''}" onclick="_trChoose('${l.c}')">${l.f}<span><b>${l.n}</b><span>${on?'Affiché':l.c===src?'Version originale':ready?'Déjà traduit':'Traduction automatique'}</span></span></button>`}).join('')}</div>
      <p class="note">Traduction automatique gratuite (quota limité par jour). Les titres et les noms restent en version originale.</p>`);
  };
  paint();
  if(PROFILE.autoTr&&src!=='fr')choose('fr');
}

const EMOJIS=['🎬','🍿','🎭','🎞️','📺','🦇','🧙','🚀','👽','🕵️','🦖','🐉','🌙','🔥','💀','🎮'];

const LVL_T=['Débutant','Curieux','Spectateur','Cinéphile','Passionné','Critique','Maître','Légende','Oscarisé','Dieu du 7e art'];
function kstats(){
  const cnt=s=>LIST.filter(x=>x.status===s).length;
  const eps=LIST.reduce((s,x)=>s+(x.type==='tv'?x.watched.length:0),0),films=LIST.filter(x=>x.type==='movie'&&x.status==='completed').length;
  const mins=LIST.reduce((s,x)=>s+(x.type==='tv'?x.watched.length*(x.runtime||45):(x.status==='completed'?(x.runtime||110):0)),0);
  const rated=LIST.filter(x=>x.rating>0),avg=rated.length?rated.reduce((s,x)=>s+x.rating,0)/rated.length:0;
  const completed=cnt('completed'),total=LIST.length,xp=eps*10+films*40+completed*30+total*5,level=Math.floor(Math.sqrt(xp/40))+1;
  const base=40*(level-1)**2,next=40*level**2;
  const gc={};LIST.forEach(x=>(x.genres||[]).forEach(g=>gc[g]=(gc[g]||0)+1));
  return{total,eps,films,mins,avg,rated:rated.length,completed,watching:cnt('watching'),planned:cnt('planned'),dropped:cnt('dropped'),xp,level,xpPct:Math.max(0,Math.min(100,Math.round((xp-base)/(next-base)*100))),toNext:next-xp,
    title:LVL_T[Math.min(LVL_T.length-1,Math.floor((level-1)/2))],topGenres:Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,6)};
}
function donut(parts){const tot=parts.reduce((s,p)=>s+p.v,0),r=42,c=2*Math.PI*r;let off=0;
  let s=`<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="Répartition par statut"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface3)" stroke-width="14"/>`;
  if(tot)parts.forEach(p=>{const len=p.v/tot*c;if(len>0)s+=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${p.c}" stroke-width="14" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len});
  return s+`<text x="60" y="58" text-anchor="middle" fill="var(--text)" font-family="Dela Gothic One" font-size="22">${tot}</text><text x="60" y="74" text-anchor="middle" fill="var(--muted)" font-size="9">titres</text></svg>`}
function insights(S){
  if(!S.total)return'<p class="note">Pas encore de données pour un bilan.</p>';
  let A;
  if(S.total<3)A=['🌱','Le Nouveau venu','La collection ne fait que commencer.'];
  else if(S.dropped/S.total>.25)A=['🦋','Le Zappeur','Goûte beaucoup, n\'insiste pas quand ça ne prend pas.'];
  else if(S.planned/S.total>.6)A=['📦','Le Collectionneur','La pile « à voir » est plus haute que la pile « vu ».'];
  else if(S.eps>=300)A=['🏃','Le Marathonien','Enchaîne les épisodes comme d\'autres les kilomètres.'];
  else if(S.completed/S.total>.6&&S.avg>=4)A=['🎓','Le Cinéphile','Finit ce qu\'il commence, et choisit bien.'];
  else if(S.watching>=4)A=['🌀','Le Papillon','Plusieurs séries en parallèle, jamais une seule à la fois.'];
  else if(S.rated>=5&&S.avg<=2.5)A=['🧐','Le Critique','Peu de titres trouvent grâce à ses yeux.'];
  else A=['🧭','L\'Explorateur','Un peu de tout, sans étiquette.'];
  const fin=LIST.filter(x=>x.status==='completed');
  const time=S.mins>=1440?(S.mins/1440).toFixed(1).replace('.',',')+' jours':S.mins>=60?Math.round(S.mins/60)+' h':S.mins+' min';
  const longest=fin.filter(a=>a.type==='tv'&&a.totalEps).sort((a,b)=>b.totalEps-a.totalEps)[0];
  const yc={};LIST.forEach(a=>{if(+a.year){const d=Math.floor(a.year/10)*10;yc[d]=(yc[d]||0)+1}});const dec=Object.entries(yc).sort((a,b)=>b[1]-a[1])[0];
  const best=[...LIST].filter(a=>a.rating>0).sort((a,b)=>b.rating-a.rating)[0],tg=S.topGenres[0];
  const facts=[[time,'de visionnage, soit environ '+Math.max(1,Math.round(S.mins/120))+' films de 2 h'],[S.eps.toLocaleString('fr')+' épisodes','vus au total'],
    [Math.round(S.completed/Math.max(1,S.completed+S.dropped+S.watching)*100)+' %','de complétion (terminés / commencés)'],
    tg?[tg[0],Math.round(tg[1]/S.total*100)+' % de la liste']:null,dec?['Années '+dec[0],'décennie la plus représentée ('+dec[1]+' titres)']:null,
    longest?[longest.totalEps+' épisodes','plus longue série terminée : '+longest.title]:null,best?['★ '+best.rating+' / 5','meilleure note : '+best.title]:null,[S.toNext+' XP','avant le niveau '+(S.level+1)]].filter(Boolean);
  const hist=[1,2,3,4,5].map(n=>LIST.filter(a=>a.rating===n).length),hm=Math.max(1,...hist);
  return`<div class="arche"><div class="i">${A[0]}</div><div><div class="k">Profil de spectateur</div><div class="t">${A[1]}</div><div class="d">${A[2]}</div></div></div>
  <div class="facts">${facts.map(f=>`<div class="fact"><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div>`).join('')}</div>
  <div class="lab" style="margin-top:0">Répartition des notes</div><div class="histo">${hist.map((c,i)=>`<div class="hc2"><span>${c}</span><div class="hb" style="height:${Math.round(c/hm*78)}px"></div><span>${'★'.repeat(i+1)}</span></div>`).join('')}</div>`;
}

  if(document.getElementById('palov'))return;
  const ov=document.createElement('div');ov.className='mov';ov.id='palov';
  ov.innerHTML=`<div class="pal" role="dialog" aria-modal="true"><input id="palIn" placeholder="Une commande, ou le nom d'un film / d'une série…" autocomplete="off" aria-label="Recherche rapide"><div class="pl2" id="palList"></div><footer><span><kbd>↑</kbd> <kbd>↓</kbd> naviguer</span><span><kbd>↵</kbd> ouvrir</span><span><kbd>Esc</kbd> fermer</span></footer></div>`;
  document.body.appendChild(ov);ov.addEventListener('mousedown',e=>{if(e.target===ov)closePalette()});
  const inp=$('#palIn');
  inp.addEventListener('input',()=>{palSel=0;clearTimeout(palTimer);buildPal([]);const q=inp.value.trim();if(q.length>=2)palTimer=setTimeout(()=>palSearch(q),350)});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palItems.length-1,palSel+1);paintPal()}
    else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(0,palSel-1);paintPal()}
    else if(e.key==='Enter'){e.preventDefault();runPal(palSel)}});
  palSel=0;buildPal([]);inp.focus();
}
function closePalette(){const o=document.getElementById('palov');if(o)o.remove()}
function buildPal(remote){
  const q=($('#palIn')?.value||'').trim().toLowerCase();
  const cmds=PAL_CMDS().filter(c=>!q||c.t.toLowerCase().includes(q)).map(c=>({ic:c.ic,t:c.t,hint:'Commande',run:c.run}));
  const mine=q.length>=2?LIST.filter(a=>a.title.toLowerCase().includes(q)).slice(0,4).map(a=>({ic:'📚',t:a.title,hint:'Ma liste',run:()=>location.hash='#item/'+a.key})):[];
  const rem=remote.map(a=>({ic:a.type==='tv'?'📺':'🎬',t:a.title+(a.year?' ('+a.year+')':''),hint:a.type==='tv'?'Série':'Film',run:()=>{CC[a.key]=a;location.hash='#item/'+a.key}}));
  palItems=[...mine,...rem,...cmds];if(palSel>=palItems.length)palSel=0;paintPal();
}
function paintPal(){
  const l=$('#palList');if(!l)return;
  l.innerHTML=palItems.length?palItems.map((it,i)=>`<div class="pi ${i===palSel?'sel':''}" onmouseenter="palSel=${i};paintPal()" onclick="runPal(${i})"><span style="width:26px;text-align:center">${it.ic}</span><span>${esc(it.t)}</span><small>${it.hint}</small></div>`).join(''):'<div class="empty" style="border:0">Aucun résultat</div>';
  const s=l.querySelector('.sel');if(s)s.scrollIntoView({block:'nearest'});
}
async function palSearch(q){
  try{const rs=await Promise.allSettled([tvSearch(q),movSearch(q)]);
    if(($('#palIn')?.value||'').trim()!==q)return;
    buildPal([...(rs[0].value||[]).slice(0,4),...(rs[1].value||[]).slice(0,4)]);
  }catch(e){}
}
function runPal(i){const it=palItems[i];if(!it)return;closePalette();it.run()}

/* ===== GUIDE ===== */
function openGuide(){
  openModal('Guide du site',`<div class="guide">
  <h4>Le principe</h4><p>Kinéma est ton carnet privé : tu trouves un film ou une série, tu l'ajoutes à ta liste, tu notes où tu en es. Le site ne diffuse rien.</p>
  <h4>Navigation</h4><ul><li><b>Accueil</b> : tes séries en cours, les genres, les séries et films du moment.</li><li><b>Films</b> / <b>Séries</b> : des rangées par genre.</li><li><b>Découvrir</b> : recherche, genres, tri par note ou année.</li><li><b>Planning</b> : les épisodes qui sortent cette semaine.</li><li><b>Ma liste</b> : statuts, notes, progression, vue grille ou liste.</li><li><b>Profil</b> : stats, niveau, top 3, succès, personnalisation.</li></ul>
  <h4>Ma liste</h4><ul><li>Le bouton de statut ouvre un petit menu : À voir, En cours, Terminé, Abandonné.</li><li><b>+1 épisode</b> coche le prochain épisode, <b>−1</b> retire le dernier.</li><li>Les étoiles notent de 1 à 5, un second clic retire la note.</li></ul>
  <h4>Fiche</h4><ul><li>Le bouton <b>🌐 Traduire</b> traduit le synopsis (français, English, Español, Português, Deutsch, Italiano). L'option « traduire automatiquement » est dans Profil &gt; Personnaliser.</li><li>Pour une série, tu coches les épisodes un par un ou une saison entière.</li></ul>
  <h4>Raccourcis</h4><ul><li><kbd>/</kbd> aller à la recherche</li><li><kbd>Ctrl</kbd> + <kbd>K</kbd> recherche rapide (pages, commandes, titres)</li><li><kbd>Échap</kbd> fermer une fenêtre ou un menu</li></ul>
  <h4>Sauvegarde</h4><p>Ta liste est enregistrée dans ton compte (icône ☁ en haut). Exporte un JSON de temps en temps comme copie de secours.</p></div>`);
}

/* ===== CLAVIER ===== */
addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if(e.key==='Escape'){closeModal();closePalette();closePE();mlCloseMenu()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}
  if(e.key==='/'&&!typing){e.preventDefault();$('#nav-q').focus()}
});

/* ===== DÉMARRAGE (appelé après connexion Firebase) ===== */
window.startApp=function(data){
  LIST=Array.isArray(data.list)?data.list:[];
  PROFILE={...DEF_PROFILE,...(data.profile||{})};if(data.accent&&!(data.profile&&data.profile.accent))PROFILE.accent=data.accent;
  savedVer=ver;lastSync=new Date();setSync('ok');
  if(data.tmdb)localStorage.setItem('kinema_tmdb',data.tmdb);
  applyLook();window.APP_ON=true;route();
};
