<!DOCTYPE html>
<html lang="fr" data-accent="ai">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinéma — Tes films et séries</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='10' fill='%233d4cff'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white'>K</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07070a;--surface:#0e0e13;--surface2:#13131a;--surface3:#1b1b24;--ink:#262631;--text:#e6e2d8;--muted:#8b8896;--hl:#ffe14d;--gold:#ffd24d;--green:#3fe0a0;--ac:#3d4cff;--serif:'Dela Gothic One',system-ui,sans-serif;--nav:58px}
[data-accent=sakura]{--ac:#ff4f9a}[data-accent=matcha]{--ac:#12a05f}[data-accent=shu]{--ac:#ff4d2e}[data-accent=sumire]{--ac:#8a4dff}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{cursor:pointer;border:0;background:none;font:inherit;color:inherit}img{display:block;max-width:100%}
input,select{font:inherit;color:var(--text)}
::selection{background:var(--hl);color:#15131a}
.navbar{position:fixed;inset:0 0 auto 0;height:var(--nav);z-index:100;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--bg);border-bottom:3px solid var(--ink)}
.logo{font-family:var(--serif);font-size:1.15rem;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;background:var(--ac);color:#fff;border:2px solid var(--ink)}
.links{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.lk{padding:8px 13px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;border:2px solid transparent;white-space:nowrap}
.lk:hover{background:var(--surface3)}.lk.on{background:var(--hl);color:#15131a;border-color:var(--ink)}
.sbox input{width:190px;padding:9px 12px;background:var(--surface);border:2px solid var(--ink);transition:width .2s}
.sbox input:focus{outline:0;width:260px;box-shadow:3px 3px 0 var(--ac)}
.main{padding-top:var(--nav);min-height:100vh}
.page{display:none}.page.on{display:block;animation:fi .2s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{max-width:1500px;margin:0 auto;padding:30px 40px}
.sec{margin-bottom:34px}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.st{font-family:var(--serif);font-size:1.25rem;background:linear-gradient(transparent 58%,var(--ac) 58%,var(--ac) 92%,transparent 92%);padding:0 8px 0 4px;white-space:nowrap}
.sh::after{content:'';flex:1;height:2px;background:var(--ink);order:1}.sh .more{order:2;font-size:.78rem;font-weight:800;text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:3px;text-underline-offset:3px}
.row{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 16px;scrollbar-width:thin}
.row .card{flex:0 0 164px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 16px}
.card{position:relative;background:var(--surface);border:2px solid var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s;overflow:hidden}
.card:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--ac)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--surface3)}
.ci{padding:9px 10px 11px;border-top:2px solid var(--ink)}
.ct{font-weight:800;font-size:.84rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.1em}
.cs{font-size:.7rem;color:var(--muted);margin-top:3px}
.sc{position:absolute;top:0;left:0;background:var(--hl);color:#15131a;font-size:.7rem;font-weight:800;padding:4px 8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.tb{position:absolute;top:8px;right:8px;background:rgba(7,7,10,.85);border:1.5px solid var(--ink);font-size:.62rem;font-weight:800;padding:2px 7px;text-transform:uppercase;letter-spacing:.05em}
.tb.movie{background:var(--gold);color:#15131a}
.qa{position:absolute;bottom:62px;right:8px;width:32px;height:32px;background:var(--ac);color:#fff;border:2px solid var(--ink);font-size:1.2rem;font-weight:700;opacity:0;transition:opacity .15s}
.card:hover .qa{opacity:1}
.inl{position:absolute;top:34px;left:0;font-size:.62rem;font-weight:800;padding:2px 7px;color:#04201e;border:2px solid var(--ink);border-left:0}
.hero{position:relative;height:540px;overflow:hidden;border-bottom:3px solid var(--ink)}
.hs{position:absolute;inset:0;opacity:0;transition:opacity .7s;pointer-events:none}.hs.on{opacity:1;pointer-events:auto}
.hbg{position:absolute;right:0;top:0;width:62%;height:100%;object-fit:cover;clip-path:polygon(18% 0,100% 0,100% 100%,0 100%)}
.hbg2{position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.3) 1.2px,transparent 1.8px) 0 0/6px 6px}
.hc{position:absolute;left:56px;bottom:70px;max-width:560px;z-index:3}
.eb{display:flex;align-items:center;gap:12px;font-size:.72rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}.eb::before{content:'';width:40px;height:4px;background:var(--ac)}
.ht{font-family:var(--serif);font-size:2.9rem;line-height:1.1;margin-bottom:12px}
.hm{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:2px solid var(--ink);padding:3px 10px;font-size:.74rem;font-weight:700;background:var(--surface)}
.pill.g{background:var(--hl);color:#15131a}
.hsyn{font-size:.9rem;line-height:1.7;opacity:.8;margin-bottom:22px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--ac);color:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:800;font-size:.85rem;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.btn.s{background:var(--surface);color:var(--text)}
.dots{position:absolute;bottom:26px;left:56px;display:flex;gap:6px;z-index:4}.dot{width:22px;height:6px;background:var(--ink);cursor:pointer}.dot.on{background:var(--ac);width:46px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.pl{padding:8px 16px;border:2px solid var(--ink);background:var(--surface);font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
.pl:hover{background:var(--surface3)}.pl.on{background:var(--ac);color:#fff}
h1.pt{font-family:var(--serif);font-size:2rem;margin-bottom:18px}
.bigsearch input{width:100%;padding:14px 16px;background:var(--surface);border:2px solid var(--ink);font-size:1rem;margin-bottom:16px}
.bigsearch input:focus{outline:0;box-shadow:3px 3px 0 var(--ac)}
.dh{position:relative;min-height:520px;display:flex;align-items:flex-end;border-bottom:3px solid var(--ink);overflow:hidden}
.dh .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;filter:blur(8px) saturate(1.2);transform:scale(1.1)}
.dh .gr{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,7,10,.98),rgba(7,7,10,.5))}
.dhc{position:relative;display:flex;gap:40px;align-items:flex-end;padding:120px 40px 44px;max-width:1400px;margin:0 auto;width:100%}
.dhc>img{width:230px;border:4px solid #f6f1e4;box-shadow:12px 12px 0 var(--ac);flex-shrink:0}
.dt{font-family:var(--serif);font-size:clamp(2rem,4.5vw,3.8rem);line-height:1.05;margin-bottom:12px}
.back{position:absolute;top:calc(var(--nav) + 18px);left:40px;z-index:5;border:2px solid rgba(255,255,255,.5);padding:7px 15px;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;background:rgba(0,0,0,.4)}
.back:hover{background:var(--ac)}
.db{display:grid;grid-template-columns:1fr 330px;gap:36px;max-width:1400px;margin:0 auto;padding:34px 40px 70px}
.syn{font-size:1.02rem;line-height:1.9;border-left:5px solid var(--ac);padding-left:20px;margin-bottom:30px;max-width:800px;opacity:.92}
.panel{background:var(--surface);border:2px solid var(--ink);padding:18px;margin-bottom:14px}
.panel.t{border-top:5px solid var(--ac);box-shadow:5px 5px 0 var(--ac)}
.pt2{font-family:var(--serif);font-size:.95rem;margin-bottom:12px}
.ir{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--ink);font-size:.81rem}.ir:last-child{border:0}.ir span:first-child{color:var(--muted)}.ir b{text-align:right}
select.f,input.f{width:100%;padding:10px 12px;background:var(--surface2);border:2px solid var(--ink);margin-bottom:10px}
.stars{display:flex;gap:2px;margin:6px 0 12px}.star{font-size:1.4rem;color:var(--gold);opacity:.25;cursor:pointer}.star.on{opacity:1}.star:hover{opacity:1;transform:scale(1.2)}
.bar{height:10px;border:2px solid var(--ink);background:var(--surface);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.season{margin-bottom:22px}
.sth{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800}
.ep{display:flex;gap:12px;align-items:center;padding:9px 12px;border:2px solid var(--ink);background:var(--surface2);margin-bottom:6px;cursor:pointer}
.ep:hover{border-color:var(--ac)}.ep.w{border-color:rgba(63,224,160,.5);background:rgba(63,224,160,.07)}
.en{width:36px;height:36px;display:grid;place-items:center;background:var(--surface3);font-family:var(--serif);font-size:.82rem;flex-shrink:0}.ep.w .en{background:rgba(63,224,160,.2);color:var(--green)}
.ek{margin-left:auto;width:22px;height:22px;border:2px solid var(--ink);display:grid;place-items:center;font-size:.7rem;color:transparent}.ep.w .ek{background:var(--green);border-color:var(--green);color:#04201e}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px}.cast img{width:100%;aspect-ratio:3/4;object-fit:cover;border:2px solid var(--ink);background:var(--surface3)}.cast b{display:block;font-size:.76rem;margin-top:5px}.cast small{font-size:.68rem;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px}
.day{flex:1;min-width:66px;padding:10px 6px;border:2px solid var(--ink);background:var(--surface);text-align:center}.day span{display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--muted)}.day b{font-family:var(--serif);font-size:1.4rem}.day.on{background:var(--ac);color:#fff}.day.on span{color:#fff}
.sr{display:flex;align-items:center;gap:16px;padding:10px 14px;background:var(--surface);border:2px solid var(--ink);border-left:6px solid var(--ink);margin-bottom:8px;cursor:pointer}.sr:hover,.sr.m{border-left-color:var(--ac)}
.sr .tm{font-family:var(--serif);font-size:1.2rem;width:62px;flex-shrink:0}.sr img{width:42px;height:60px;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:2px solid var(--ink);border-top:5px solid var(--ac);padding:16px 10px;text-align:center}.stat b{display:block;font-family:var(--serif);font-size:1.5rem}.stat span{font-size:.72rem;color:var(--muted)}
.gbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.78rem}.gbar em{width:110px;text-align:right;font-style:normal;color:var(--muted)}.gbar div{flex:1;height:10px;border:2px solid var(--ink)}.gbar div i{display:block;height:100%;background:var(--ac)}
.ml{display:flex;gap:6px;margin-top:8px}
.mb{flex:1;padding:7px 8px;border:2px solid var(--ink);background:var(--surface2);font-size:.68rem;font-weight:800;text-transform:uppercase}.mb:hover{background:var(--hl);color:#15131a}
.toasts{position:fixed;bottom:22px;right:22px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:2px solid var(--ink);padding:11px 15px;font-size:.84rem;box-shadow:4px 4px 0 var(--ac);animation:fi .2s}
.spin{width:24px;height:24px;border:3px solid var(--ink);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--muted);border:2px dashed var(--ink)}
.foot{text-align:center;padding:30px;font-size:.75rem;color:var(--muted);border-top:3px solid var(--ink)}
.note{font-size:.76rem;color:var(--muted);line-height:1.6;margin-top:8px}
.keybox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 18px;margin-bottom:28px;background:var(--surface);border:2px solid var(--hl);box-shadow:5px 5px 0 var(--hl)}
.keybox p{flex:1;min-width:240px;font-size:.84rem;line-height:1.55}.keybox input{padding:10px 12px;background:var(--surface2);border:2px solid var(--ink);width:280px}
@media(max-width:900px){.navbar{padding:0 12px;gap:8px}.sbox input{width:120px}.wrap{padding:20px 16px}.hc{left:20px;right:20px}.ht{font-size:2rem}.hbg{width:100%;opacity:.3;clip-path:none}.db{grid-template-columns:1fr;padding:24px 16px}.dhc{flex-direction:column;align-items:flex-start;padding:110px 16px 30px}.dhc>img{width:150px}.logo span{display:none}.back{left:16px}}
</style>
</head>
<body>
<nav class="navbar">
  <a class="logo" href="#home"><i>K</i><span>Kinéma</span></a>
  <div class="links">
    <a class="lk" href="#home" data-p="home">Accueil</a><a class="lk" href="#films" data-p="films">Films</a><a class="lk" href="#catalogue" data-p="catalogue">Découvrir</a>
    <a class="lk" href="#schedule" data-p="schedule">Planning</a><a class="lk" href="#mylist" data-p="mylist">Ma liste</a><a class="lk" href="#profile" data-p="profile">Profil</a>
  </div>
  <div class="sbox"><input id="nav-q" placeholder="Rechercher… ( / )" autocomplete="off"></div>
</nav>
<main class="main">
  <div class="page" id="p-home"></div><div class="page" id="p-films"></div><div class="page" id="p-catalogue"></div><div class="page" id="p-schedule"></div>
  <div class="page" id="p-mylist"></div><div class="page" id="p-profile"></div><div class="page" id="p-detail"></div>
</main>
<div class="toasts" id="toasts"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=h=>(h||'').replace(/<[^>]+>/g,'').trim();
const FALLBACK="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='300' height='450'><rect width='300' height='450' fill='#1b1b24'/><text x='150' y='230' fill='#8b8896' font-size='20' text-anchor='middle' font-family='sans-serif'>Pas d'affiche</text></svg>");
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3000)}
const ST={planned:['À voir','#7aa2ff'],watching:['En cours','#b79bff'],completed:['Terminé','#3fe0a0'],dropped:['Abandonné','#e0524f']};
let LIST=[];try{LIST=JSON.parse(localStorage.getItem('kinema_v1')||'[]')}catch(e){}
const save=()=>localStorage.setItem('kinema_v1',JSON.stringify(LIST));
const inList=k=>LIST.find(x=>x.key===k);
const TMDB=()=>localStorage.getItem('kinema_tmdb')||'';
const CACHE={};
async function getJSON(url){
  if(CACHE[url])return CACHE[url];
  try{const s=sessionStorage.getItem('c:'+url);if(s){const o=JSON.parse(s);if(Date.now()-o.t<600000){CACHE[url]=o.v;return o.v}}}catch(e){}
  const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);
  const v=await r.json();CACHE[url]=v;
  try{const j=JSON.stringify({t:Date.now(),v});if(j.length<300000)sessionStorage.setItem('c:'+url,j)}catch(e){}
  return v;
}
const isoDay=(off=0)=>{const d=new Date();d.setDate(d.getDate()+off);return d.toLocaleDateString('sv-SE')};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function cached(name,fn,days=3){
  try{const o=JSON.parse(localStorage.getItem('kc_'+name)||'null');if(o&&Date.now()-o.t<days*864e5&&o.v.length)return o.v}catch(e){}
  const v=await fn();if(v.length)try{localStorage.setItem('kc_'+name,JSON.stringify({t:Date.now(),v}))}catch(e){}
  return v;
}

/* ===== SÉRIES : TVmaze (sans clé) ===== */
const TVM='https://api.tvmaze.com';
function normTV(s){return{key:'tv:'+s.id,type:'tv',id:s.id,title:s.name,cover:s.image?.original||s.image?.medium||'',score:s.rating?.average||null,
  year:(s.premiered||'').slice(0,4),genres:s.genres||[],synopsis:strip(s.summary),status:s.status,network:s.network?.name||s.webChannel?.name||'',
  runtime:s.averageRuntime||s.runtime||45,url:s.officialSite||s.url}}
async function tvAiring(off=0){
  const d=isoDay(off);
  const rs=await Promise.allSettled([getJSON(`${TVM}/schedule/web?date=${d}`),getJSON(`${TVM}/schedule?country=US&date=${d}`),getJSON(`${TVM}/schedule?country=FR&date=${d}`)]);
  const out=[];rs.forEach(r=>{if(r.status==='fulfilled')r.value.forEach(e=>{const s=e.show||e._embedded?.show;if(s)out.push({ep:e,show:s})})});
  return out;
}
async function tvOnAir(){
  const items=await tvAiring(0),seen=new Set(),res=[];
  items.forEach(({show})=>{if(!seen.has(show.id)&&show.image&&(show.rating?.average||0)>=7&&!['Talk Show','News','Sports','Variety','Reality'].includes(show.type)){seen.add(show.id);res.push(normTV(show))}});
  return res.sort((a,b)=>(b.score||0)-(a.score||0));
}
const FAM_TV=['Breaking Bad','Game of Thrones','Stranger Things','The Boys','Better Call Saul','Peaky Blinders','The Last of Us','Dark','Money Heist','Squid Game','The Witcher','Wednesday','House of the Dragon','The Mandalorian','Sherlock','Friends','The Office','Narcos','Black Mirror','Vikings','Chernobyl','True Detective','Succession','The Walking Dead','Dexter','Lucifer','Arcane','Fallout','Severance','The Bear','Ozark','Mindhunter','Prison Break','The Big Bang Theory','How I Met Your Mother','Lupin'];
async function tvPopularNow(){
  return cached('famtv',async()=>{
    const out=[];
    for(let i=0;i<FAM_TV.length;i+=8){
      const rs=await Promise.allSettled(FAM_TV.slice(i,i+8).map(n=>getJSON(`${TVM}/singlesearch/shows?q=${encodeURIComponent(n)}`)));
      rs.forEach(r=>{if(r.status==='fulfilled'&&r.value&&r.value.image)out.push(normTV(r.value))});
      await sleep(700);
    }
    return out;
  });
}
const tvSearch=async q=>(await getJSON(`${TVM}/search/shows?q=${encodeURIComponent(q)}`)).map(x=>normTV(x.show)).sort((a,b)=>(b.score||0)-(a.score||0));
async function tvDetail(id){const s=await getJSON(`${TVM}/shows/${id}?embed[]=episodes&embed[]=cast`);const n=normTV(s);
  n.episodes=(s._embedded?.episodes||[]).map(e=>({id:e.id,season:e.season,number:e.number,name:e.name,airdate:e.airdate}));
  n.cast=(s._embedded?.cast||[]).slice(0,12).map(c=>({name:c.person.name,role:c.character.name,img:c.person.image?.medium||''}));
  n.totalEps=n.episodes.length;return n}

/* ===== FILMS : TMDB (clé gratuite) ou iTunes (sans clé) ===== */
const ITU='https://itunes.apple.com';
const big=u=>(u||'').replace(/\d+x\d+(bb)?\./,'600x900bb.');
function normIT(m){return{key:'it:'+m.trackId,type:'movie',id:m.trackId,title:m.trackName,cover:big(m.artworkUrl100),score:null,year:(m.releaseDate||'').slice(0,4),
  genres:m.primaryGenreName?[m.primaryGenreName]:[],synopsis:m.longDescription||m.shortDescription||'',director:m.artistName,runtime:m.trackTimeMillis?Math.round(m.trackTimeMillis/60000):null,
  preview:m.previewUrl,url:m.trackViewUrl,rating:m.contentAdvisoryRating}}
const TMI='https://image.tmdb.org/t/p/';
const GENRE_TM={28:'Action',12:'Aventure',16:'Animation',35:'Comédie',80:'Policier',18:'Drame',14:'Fantastique',27:'Horreur',878:'Science-fiction',53:'Thriller',10749:'Romance',37:'Western'};
function normTM(m){return{key:'tm:'+m.id,type:'movie',id:m.id,title:m.title,cover:m.poster_path?TMI+'w500'+m.poster_path:'',banner:m.backdrop_path?TMI+'w1280'+m.backdrop_path:'',
  score:m.vote_average?Math.round(m.vote_average*10)/10:null,year:(m.release_date||'').slice(0,4),
  genres:(m.genres||(m.genre_ids||[]).map(i=>({name:GENRE_TM[i]})).filter(g=>g.name)).map(g=>g.name),synopsis:m.overview||'',runtime:m.runtime||null,url:'https://www.themoviedb.org/movie/'+m.id}}
const tm=(path,p='')=>getJSON(`https://api.themoviedb.org/3${path}?api_key=${TMDB()}&language=fr-FR${p}`);

  <div class="pills">${[['all','Tous'],...Object.entries(ST).map(([k,v])=>[k,v[0]])].map(([k,l])=>`<button class="pl ${lf.st===k?'on':''}" onclick="lf.st='${k}';rList()">${l} <small>${cnt(k)}</small></button>`).join('')}</div>
  <div class="pills"><input class="f" id="lq" style="width:240px;margin:0" placeholder="Filtrer…" value="${esc(lf.q)}" onchange="lf.q=this.value;rList()">
  <select class="f" style="width:auto;margin:0" onchange="lf.type=this.value;rList()">${[['all','Séries + films'],['tv','Séries'],['movie','Films']].map(([k,l])=>`<option value="${k}" ${lf.type===k?'selected':''}>${l}</option>`).join('')}</select>
  <select class="f" style="width:auto;margin:0" onchange="lf.sort=this.value;rList()">${[['recent','Récent'],['alpha','A→Z'],['rating','Note'],['progress','Progression']].map(([k,l])=>`<option value="${k}" ${lf.sort===k?'selected':''}>${l}</option>`).join('')}</select>
  <button class="pl" onclick="pickForMe()">🎲 Que regarder ?</button></div>
  ${items.length?`<div class="grid">${items.map(listCard).join('')}</div>`:`<div class="empty">${LIST.length?'Aucun résultat.':'Ta liste est vide. <br><br><a class="btn" href="#catalogue">Ouvrir le catalogue</a>'}</div>`}</div>`;
}
function listCard(l){const tot=l.totalEps||0,pct=tot?Math.round(l.watched.length/tot*100):(l.status==='completed'?100:0);
  return`<div class="card" onclick="location.hash='#item/${esc(l.key)}'"><img src="${esc(l.cover||FALLBACK)}" alt="" loading="lazy" onerror="this.src='${FALLBACK}'"><div class="sc" style="background:${ST[l.status][1]}">${ST[l.status][0]}</div><div class="tb ${l.type}">${l.type==='tv'?'Série':'Film'}</div>
  <div class="ci"><div class="ct">${esc(l.title)}</div><div class="bar" style="height:8px;margin:6px 0"><i style="width:${pct}%"></i></div>
  <div class="cs">${l.type==='tv'?`${l.watched.length}${tot?' / '+tot:''} ép.`:(l.status==='completed'?'Vu':'—')} ${l.rating?'· '+'★'.repeat(l.rating):''}</div>
  <div class="ml">${l.type==='tv'?`<button class="mb" onclick="event.stopPropagation();nextEp('${esc(l.key)}')">+1 ép.</button>`:`<button class="mb" onclick="event.stopPropagation();markSeen('${esc(l.key)}')">${l.status==='completed'?'Revoir':'Vu ✓'}</button>`}</div></div></div>`}
async function nextEp(k){
  const l=inList(k);toast('Chargement…');
  try{const a=await tvDetail(l.id);CC[k]=a;l.totalEps=a.totalEps;const nxt=a.episodes.find(e=>!l.watched.includes(e.id));
    if(!nxt){toast('Tout est déjà vu');return}l.watched.push(nxt.id);autoStatus(l);save();toast(`${l.title} · S${nxt.season}E${nxt.number}`);rList()}catch(e){toast('Erreur : '+e.message)}
}
function markSeen(k){const l=inList(k);l.status=l.status==='completed'?'planned':'completed';save();rList()}
function pickForMe(){const p=LIST.filter(x=>x.status==='planned');if(!p.length){toast('Ajoute des titres « À voir »');return}location.hash='#item/'+p[Math.floor(Math.random()*p.length)].key}

/* ===== PROFIL ===== */
function rProfile(){
  const c=s=>LIST.filter(x=>x.status===s).length;
  const eps=LIST.reduce((s,x)=>s+(x.type==='tv'?x.watched.length:0),0);
  const mins=LIST.reduce((s,x)=>s+(x.type==='tv'?x.watched.length*(x.runtime||45):(x.status==='completed'?(x.runtime||110):0)),0);
  const films=LIST.filter(x=>x.type==='movie'&&x.status==='completed').length;
  const rated=LIST.filter(x=>x.rating>0),avg=rated.length?(rated.reduce((s,x)=>s+x.rating,0)/rated.length).toFixed(1):'—';
  const xp=eps*10+films*40+c('completed')*30+LIST.length*5,lvl=Math.floor(Math.sqrt(xp/40))+1;
  const gc={};LIST.forEach(x=>(x.genres||[]).forEach(g=>gc[g]=(gc[g]||0)+1));const tg=Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=tg[0]?.[1]||1;
  const h=mins>=60?Math.round(mins/60)+' h':mins+' min';
  $('#p-profile').innerHTML=`<div class="wrap"><h1 class="pt">Mon profil</h1><div class="stats">${[['Titres',LIST.length],['Séries',LIST.filter(x=>x.type==='tv').length],['Films vus',films],['Épisodes',eps],['Temps',h],['Note moy.',avg],['Niveau',lvl],['XP',xp]].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
  <div class="panel"><div class="pt2">Genres favoris</div>${tg.length?tg.map(([g,n])=>`<div class="gbar"><em>${esc(g)}</em><div><i style="width:${Math.round(n/mx*100)}%"></i></div>${n}</div>`).join(''):'<p class="note">Ajoute des titres pour voir tes genres.</p>'}</div>
  <div class="panel"><div class="pt2">Couleur d'accent</div><div class="pills">${['ai','sakura','matcha','shu','sumire'].map(a=>`<button class="pl" onclick="setAccent('${a}')">${a}</button>`).join('')}</div></div>
  <div class="panel"><div class="pt2">Clé TMDB (films)</div><input class="f" id="tk" placeholder="Clé API TMDB (v3, 32 caractères)" value="${esc(TMDB())}"><button class="btn" onclick="setKey($('#tk').value)">Enregistrer</button> <button class="btn s" onclick="localStorage.removeItem('kinema_tmdb');location.reload()">Retirer la clé</button></div>
  <div class="panel"><div class="pt2">Données</div><button class="btn s" onclick="exportJSON()">Exporter JSON</button> <label class="btn s">Importer<input type="file" accept=".json" hidden onchange="importJSON(this)"></label></div></div>`;
}
function setAccent(a){document.documentElement.dataset.accent=a;localStorage.setItem('kinema_acc',a)}
setAccent(localStorage.getItem('kinema_acc')||'ai');
function exportJSON(){const b=new Blob([JSON.stringify(LIST,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kinema-liste.json';a.click();URL.revokeObjectURL(a.href)}
function importJSON(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const arr=JSON.parse(r.result);if(!Array.isArray(arr))throw 0;let n=0;
  arr.forEach(x=>{if(x&&typeof x.key==='string'&&typeof x.title==='string'&&!inList(x.key)){LIST.push({key:x.key,type:x.type==='tv'?'tv':'movie',id:x.id,title:x.title.slice(0,200),cover:/^https:\/\//.test(x.cover||'')?x.cover:'',genres:Array.isArray(x.genres)?x.genres.slice(0,5):[],year:x.year,
  status:ST[x.status]?x.status:'planned',rating:Math.min(5,Math.max(0,+x.rating||0)),watched:Array.isArray(x.watched)?x.watched.filter(Number.isInteger):[],totalEps:+x.totalEps||0,runtime:+x.runtime||0,addedAt:+x.addedAt||Date.now()});n++}});
  save();toast(n+' titre(s) importé(s)');rProfile()}catch(e){toast('Fichier invalide')}};r.readAsText(f)}
route();
</script>
</body>
